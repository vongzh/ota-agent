services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stayota
      POSTGRES_PASSWORD: stayota
      POSTGRES_DB: stayota_refund
    ports:
      - "5432:5432"
    volumes:
      - stayota_pg:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  agent:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5088:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=stayota_refund;Username=stayota;Password=stayota
      ConnectionStrings__Redis: redis:6379
      Hosting__DemoEnabled: "true"
      Hosting__ResetDatabaseOnStartup: "true"
      STAYOTA_AGENT_ROOT: /data
    depends_on:
      - postgres
      - redis

volumes:
  stayota_pg:
