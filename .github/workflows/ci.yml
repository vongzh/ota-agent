name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test with coverage gate
        run: >
          dotnet test backend/StayOta.Agent.slnx
          --configuration Release
          --nologo
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=../../../artifacts/coverage/
          /p:ExcludeByFile="**/Migrations/**"
          /p:Threshold=35
          /p:ThresholdType=line
          /p:ThresholdStat=total
        env:
          STAYOTA_AGENT_ROOT: ${{ github.workspace }}
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/coverage/
          if-no-files-found: ignore

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Pack Abstractionsctions + Agent + Echo
        run: bash scripts/pack.sh
      - name: Verify nupkgs
        run: |
          test -f artifacts/nuget/StayOta.Agent.Abstractions.0.1.0.nupkg
          test -f artifacts/nuget/StayOta.Agent.0.1.0.nupkg
          test -f artifacts/nuget/StayOta.Agent.Plugins.Echo.0.1.0.nupkg
          ls -la artifacts/nuget/*.nupkg

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
